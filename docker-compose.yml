services:
  bio-pipelines:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bio_pipelines_full
    ports:
      - "8090:8090"
      - "28819:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: bio_demo
      PG_BIO_URL: postgresql://postgres@127.0.0.1:5432/bio_demo
      SWARM_WEB_HOST: 0.0.0.0
      SWARM_WEB_PORT: "8090"
    volumes:
      - bio_pipelines_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/api/swarm?pipeline=ptfe-to-bioceramic >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bio_pipelines_pgdata:
